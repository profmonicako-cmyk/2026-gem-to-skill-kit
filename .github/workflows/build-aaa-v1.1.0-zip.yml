name: Build AAA v1.1.0 release ZIP

on:
  push:
    branches: [main]
    paths:
      - 'releases/aaa-v1-workflow-generator-v1.1.0/_build/**'
      - '.github/workflows/build-aaa-v1.1.0-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct ZIP from Base64 chunks
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR='releases/aaa-v1-workflow-generator-v1.1.0'
          cat "$RELEASE_DIR"/_build/part01a.b64 \
              "$RELEASE_DIR"/_build/part01b.b64 \
              "$RELEASE_DIR"/_build/part01c.b64 \
              "$RELEASE_DIR"/_build/part02.b64 \
              "$RELEASE_DIR"/_build/part03.b64 \
              "$RELEASE_DIR"/_build/part04.b64 \
            | base64 --decode > "$RELEASE_DIR/aaa-v1-workflow-generator-v1.1.0.zip"

      - name: Verify checksum and ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR='releases/aaa-v1-workflow-generator-v1.1.0'
          echo 'd8242715569b9b8a2e492496f179c3045950761d1156f90b7becee59e58ecc25  releases/aaa-v1-workflow-generator-v1.1.0/aaa-v1-workflow-generator-v1.1.0.zip' | sha256sum -c -
          unzip -t "$RELEASE_DIR/aaa-v1-workflow-generator-v1.1.0.zip"

      - name: Commit release ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/aaa-v1-workflow-generator-v1.1.0/aaa-v1-workflow-generator-v1.1.0.zip
          if git diff --cached --quiet; then
            echo 'ZIP already up to date.'
          else
            git commit -m 'release: add AAA v1.1.0 workflow generator ZIP'
            git push
          fi
